[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vmcore"
# 0.2.0 rather than 0.1.1: `segcache.segment_key` gained a REQUIRED
# `fps` argument. Its absence was a silent wrong-pixels hit, so the break
# is the fix - a caller written against 0.1.0 gets a TypeError naming the
# argument instead of a key that was quietly wrong. Consumers pin a
# commit, so nothing moves until someone bumps a pin deliberately.
version = "0.2.0"
description = "Input-agnostic video plumbing: probe, sampled frames, frame signals, HDR-aware proxies, FCP7/xmeml, and a content-addressed segment cache"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Geoff Schultz"}]
# numpy is here because frames are handed out as arrays and every consumer
# wants them that way. Everything else is the standard library plus ffmpeg,
# which is an external binary rather than a wheel. tests/test_no_app_imports
# enforces that this list stays this short.
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["vmcore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
